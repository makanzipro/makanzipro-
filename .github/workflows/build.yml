name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: unzip -o MakanziproApp.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compiler l'APK
        working-directory: MakanziproApp
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Makanzipro-APK
          path: MakanziproApp/app/build/outputs/apk/debug/app-debug.apk
